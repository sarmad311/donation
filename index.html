<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Support a Student's Education</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet"/>

  <!-- React via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <style>
    body {
      background: linear-gradient(135deg, #f8f1ea, #fdfdfd);
      font-family: 'Quicksand', sans-serif;
      color: #4b3b30;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      cursor: none !important;
    }

    #root {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 1rem;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .card {
      background: #fff8f2;
      border-radius: 20px;
      padding: 3rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      animation: fadeIn 1.2s ease-in-out;
      position: relative;
      z-index: 2;
    }

    .card h1 {
      font-weight: 600;
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #9f6b4f;
    }

    .card p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }

    .info-list {
      background: #fff2e2;
      border-left: 5px solid #ffbf86;
      padding: 1rem 1.5rem;
      border-radius: 12px;
    }

    .info-list li {
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    .info-list span {
      font-weight: 700;
      color: #bc5a2e;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #f6e9de;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #d7a97b;
      border-radius: 10px;
      border: 3px solid #f6e9de;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #bf7c4d;
    }

    /* Custom Cursor HTML */
    .custom-cursor {
      width: 25px;
      height: 25px;
      background: rgba(255, 105, 97, 0.9);
      border: 2px solid white;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.05s ease-out;
      box-shadow: 0 0 10px rgba(255, 105, 97, 0.6);
    }

    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.5rem;
      }

      .card h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor Element -->
  <div class="custom-cursor" id="cursor"></div>

  <!-- React Root -->
  <div id="root"></div>

  <!-- React App Script -->
  <script type="text/javascript">
    const e = React.createElement;

    function DonationCard() {
      return (
        React.createElement("div", { className: "card" },
          React.createElement("h1", null, "A Kind Appeal from a University Student"),
          React.createElement("p", null,
            "Hello dear visitor, I’m a university student striving to build a better future through education. Unfortunately, financial constraints make this journey difficult."
          ),
          React.createElement("p", null,
            "If you feel kind enough to help, even the smallest support will bring me closer to continuing my studies and dreams."
          ),
          React.createElement("ul", { className: "info-list list-unstyled" },
            React.createElement("li", null, React.createElement("span", null, "Bank Name: "), "Meezan Bank"),
            React.createElement("li", null, React.createElement("span", null, "Account Holder: "), "Uzma Naeem"),
            React.createElement("li", null, React.createElement("span", null, "IBAN: "), "PK32MEZN0001450100492494")
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(DonationCard));
  </script>

  <!-- Custom Cursor JavaScript -->
  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
  </script>
</body>
</html>
